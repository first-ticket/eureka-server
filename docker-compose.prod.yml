# eureka-server/docker-compose.prod.yml
# AWS 배포용 — ECR 이미지 pull
# .env: EUREKA_IMAGE=123456789.dkr.ecr.ap-northeast-2.amazonaws.com/eureka-server:latest

# AWS/prod 배포 (파일 명시)
# docker compose -f docker-compose.prod.yml up -d

services:
  eureka-server:
    image: ${EUREKA_IMAGE}
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    networks:
      - first-ticket-network

networks:
  first-ticket-network:
    external: true
    name: first-ticket-network